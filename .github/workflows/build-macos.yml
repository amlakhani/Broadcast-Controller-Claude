name: Build macOS DMGs

# Builds the macOS installers (Apple Silicon + Intel) on a GitHub-hosted macOS
# runner, so no Mac hardware is needed. grandiose downloads the NDI SDK from
# downloads.ndi.tv during install and compiles the native module per-arch, so
# the build is fully unattended — no secrets, no manual SDK step.
#
# Run it manually from the Actions tab (workflow_dispatch), or push a version
# tag like v1.0.0 to also publish a GitHub Release with the DMGs attached.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed only for the Release step on tag pushes

jobs:
  build-macos:
    runs-on: macos-latest # Apple Silicon; ships Xcode CLT, pkgutil, cpio, python
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # Root install compiles grandiose.node for the runner's arch (arm64) and,
      # via the preinstall hook, first checks the mac build toolchain is present.
      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # Gate packaging on the suite. Without this a tagged push could publish a Release built
      # from a broken commit, since nothing else on this path runs the tests.
      - name: Run tests
        run: npm test

      # build:mac runs prebuild:mac (frontend build + NDI check/rebuild/verify),
      # then packages arm64 and x64 DMGs into "application packages/".
      # Signing is disabled: no Apple Developer cert in CI, so the DMGs are
      # unsigned (first launch needs right-click -> Open).
      - name: Build macOS DMGs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:mac

      - name: List build output
        run: ls -lh "application packages"

      - name: Upload DMGs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmgs
          if-no-files-found: error
          retention-days: 30
          path: |
            application packages/*.dmg
            application packages/*.dmg.blockmap

      # Only when triggered by a version tag: publish a Release with the DMGs.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            application packages/*.dmg
            application packages/*.dmg.blockmap
          fail_on_unmatched_files: true
          generate_release_notes: true
